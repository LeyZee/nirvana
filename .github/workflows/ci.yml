name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # nightly: e2e and evals smoke
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # gitleaks-action lists the PR commits

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Typecheck, lint, format, knip, repo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      # The media module cuts videos with ffmpeg; its tests run the real binary on synthetic clips. The apt mirror has
      # hung the job and timed out three tries in a row: the .deb files apt downloads are cached per runner image, so
      # once one run got them, later runs install them with dpkg alone, without the network.
      # The runner image's machine variables are not in the `env` context: read them in a shell for the cache key.
      - name: Name the runner image
        id: image
        run: echo "key=ffmpeg-debs-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Restore ffmpeg packages
        id: ffmpeg-debs
        uses: actions/cache/restore@v6
        with:
          path: ~/ffmpeg-debs
          key: ${{ steps.image.outputs.key }}
      - name: Install ffmpeg
        id: ffmpeg
        timeout-minutes: 15
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then exit 0; fi
          debs="$HOME/ffmpeg-debs"
          sudo rm -f /var/lib/man-db/auto-update
          if compgen -G "$debs/*.deb" >/dev/null && sudo dpkg -i "$debs"/*.deb >/dev/null; then
            ffmpeg -version | head -1
            exit 0
          fi
          # `-f` below also repairs a dpkg -i of the cache that stopped halfway.
          mkdir -p "$debs/partial"
          for attempt in 1 2 3; do
            if timeout 90 sudo apt-get update -qq &&
              timeout 180 sudo apt-get install -y -qq -f --no-install-recommends \
                -o Dir::Cache::Archives="$debs" -o APT::Keep-Downloaded-Packages=true ffmpeg; then
              sudo chown -R "$USER" "$debs"
              rm -rf "$debs/partial" "$debs/lock"
              if compgen -G "$debs/*.deb" >/dev/null; then echo "fresh=true" >> "$GITHUB_OUTPUT"; fi
              exit 0
            fi
            echo "ffmpeg install failed (attempt $attempt), retrying"
            sleep 5
          done
          exit 1
      # Saved right away, not at the end of the job: a red test must not lose the packages.
      - name: Save ffmpeg packages
        if: steps.ffmpeg.outputs.fresh == 'true' && steps.ffmpeg-debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/ffmpeg-debs
          key: ${{ steps.image.outputs.key }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:integration
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
      # Phase 0 end to end: API and worker inline, FakeConnector, a fan message to a sent draft (P0-07b).
      - run: pnpm test:e2e
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check, test]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  nightly:
    name: Nightly e2e and evals smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:e2e
      # Both fail without a key or with nothing to measure: a nightly run never looks green for nothing.
      - run: pnpm probe
        env:
          LLM_XAI_API_KEY: ${{ secrets.LLM_XAI_API_KEY }}
          LLM_MISTRAL_API_KEY: ${{ secrets.LLM_MISTRAL_API_KEY }}
      - run: pnpm evals
        env:
          LLM_XAI_API_KEY: ${{ secrets.LLM_XAI_API_KEY }}
          LLM_MISTRAL_API_KEY: ${{ secrets.LLM_MISTRAL_API_KEY }}
