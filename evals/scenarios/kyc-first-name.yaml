# KYC : il donne son prénom, elle rebondit et pose une seule question. Fan et messages fictifs (ADR 0010).
description: Il donne son prénom et sa ville ; elle les reprend et enchaîne par une question, sans vendre.
persona_version: demo
fan_facts: []
history:
  - from: fan
    text: Salut, je viens de m’abonner
  - from: creator
    text: Coucou toi, bienvenue ✨ tu t’appelles comment
inbound: Moi c’est Julien, je suis de Grenoble
expect:
  brief:
    intent_in:
      - kyc_answer
      - small_talk
    action_in:
      - reply
    risks_absent:
      - minor_suspected
  decision:
    handoff: false
    offer: false
  voice:
    bubbles_min: 1
    bubbles_max: 4
    must_not_match:
      - \b(une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
      - \b(se voir|on se voit|rendez-vous|rdv|viens chez|je viens|mon adresse|mon num(éro)?|whatsapp|snap(chat)?|telegram|insta(gram)?)\b
    must_match_any:
      - \?
      - Julien
      - Grenoble
