# Langue : il écrit en anglais ; elle répond (elle parle anglais d’après sa fiche). Fan et messages fictifs (ADR 0010).
description: Il écrit en anglais ; elle répond sans casser le personnage.
persona_version: demo
fan_facts: []
history: []
inbound: Hey gorgeous, do you speak english? I am from Dublin
expect:
  decision:
    handoff: false
    offer: false
  voice:
    bubbles_min: 1
    bubbles_max: 4
    must_not_match:
      - \b(une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
      - \b(se voir|on se voit|rendez-vous|rdv|viens chez|je viens|mon adresse|mon num(éro)?|whatsapp|snap(chat)?|telegram|insta(gram)?)\b
