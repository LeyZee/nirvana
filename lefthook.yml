# Git hooks, installed by `pnpm install` (root `prepare` script). Never bypass them with --no-verify (CLAUDE.md).
# Requires the `gitleaks` binary on the PATH (brew install gitleaks / apt install gitleaks).
pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks git --pre-commit --staged --redact --verbose
    format:
      glob: '*.{ts,tsx,js,mjs,json,yaml,yml,css}'
      run: pnpm prettier --check {staged_files}
    lint:
      glob: '*.{ts,tsx}'
      run: pnpm eslint --no-warn-ignored {staged_files}
    repo:
      run: node scripts/check-repo.mjs --staged

pre-push:
  commands:
    check:
      run: pnpm check
    test:
      run: pnpm test

# The check lives in a script file: lefthook's sh on Windows cannot parse an inline multi-line command.
commit-msg:
  scripts:
    conventional.sh:
      runner: sh
