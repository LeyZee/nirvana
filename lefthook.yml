# Git hooks, installed by `pnpm install` (root `prepare` script). Never bypass them with --no-verify (CLAUDE.md).
# Requires the `gitleaks` binary on the PATH (brew install gitleaks / apt install gitleaks).
pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks git --pre-commit --staged --redact --verbose
    format:
      glob: "*.{ts,tsx,js,mjs,json,yaml,yml,css}"
      run: pnpm prettier --check {staged_files}
    lint:
      glob: "*.{ts,tsx}"
      run: pnpm eslint {staged_files}
    repo:
      run: node scripts/check-repo.mjs --staged

pre-push:
  commands:
    check:
      run: pnpm check
    test:
      run: pnpm test

commit-msg:
  commands:
    conventional:
      run: |
        head -1 "{1}" | grep -Eq '^(Merge |(feat|fix|docs|style|chore|refactor|test|perf|build|ci|revert)(\([a-z0-9-]+\))?!?: .{1,72}$)' \
          || { echo "Commit message does not follow Conventional Commits (see docs/conventions/git-and-pr.md)"; exit 1; }
