# Local development environment: `docker compose up -d` then `pnpm db:migrate`.
# Integration tests do not use this file (Testcontainers starts its own Postgres).
services:
  postgres:
    image: postgres:16-alpine
    container_name: nirvana-postgres
    environment:
      POSTGRES_DB: nirvana
      POSTGRES_USER: nirvana_admin
      POSTGRES_PASSWORD: change-me
    ports:
      - '5432:5432'
    volumes:
      - nirvana-pgdata:/var/lib/postgresql/data
      - ./packages/db/docker/init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nirvana_admin -d nirvana']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nirvana-pgdata:
