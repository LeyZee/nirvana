<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Nirvana" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1f"/>
      <stop offset="55%" stop-color="#161a3a"/>
      <stop offset="100%" stop-color="#0d2a2e"/>
    </linearGradient>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <clipPath id="card"><rect x="80" y="70" width="1040" height="220" rx="36"/></clipPath>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <circle cx="230" cy="90" r="190" fill="url(#g1)"/>
    <circle cx="980" cy="300" r="210" fill="url(#g2)"/>
    <circle cx="700" cy="40" r="150" fill="url(#g3)"/>
  </g>

  <g clip-path="url(#card)">
    <rect x="80" y="70" width="1040" height="220" fill="url(#glass)"/>
    <ellipse cx="300" cy="60" rx="420" ry="90" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="80" y="70" width="1040" height="1.5" fill="#ffffff" fill-opacity="0.45"/>
  </g>
  <rect x="80" y="70" width="1040" height="220" rx="36" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

  <g filter="url(#soft)">
    <circle cx="160" cy="180" r="34" fill="#ffffff" fill-opacity="0.12"/>
    <circle cx="160" cy="180" r="34" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.2"/>
  </g>
  <path d="M144 190 C150 170, 162 166, 176 170 M148 182 C156 176, 166 176, 174 182" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" stroke-linecap="round"/>

  <text x="222" y="170" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-2" fill="url(#title)">Nirvana</text>
  <text x="226" y="214" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#e2e8f0" fill-opacity="0.9">Agent de chatting pour créatrice de contenu · Reveal d'abord, plateformes ensuite</text>
  <text x="226" y="252" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#cbd5e1" fill-opacity="0.75" letter-spacing="1.5">MÉMOIRE FAN · PERSONA VERSIONNÉE · COPILOTE → AUTO · VENTES · CŒUR AGNOSTIQUE</text>

  <g font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff" fill-opacity="0.85">
    <rect x="890" y="100" width="190" height="30" rx="15" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="985" y="120" text-anchor="middle">PHASE 0 · FONDATIONS</text>
  </g>
</svg>
