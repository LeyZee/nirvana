# gitleaks configuration: default rules plus project-specific patterns.
# Only `.env.example` is allowlisted; a secret pasted in a doc must fail (P0-07 acceptance criterion).
[extend]
useDefault = true

[[rules]]
id = "nirvana-session-keys"
description = "Platform session encryption key"
regex = '''SESSION_ENCRYPTION_KEYS\s*=\s*v\d+:[A-Za-z0-9+/=]{40,}'''

[[rules]]
id = "nirvana-llm-keys"
description = "LLM API key"
regex = '''LLM_[A-Z]+_API_KEY\s*=\s*[A-Za-z0-9_\-]{20,}'''

[allowlist]
paths = ['''\.env\.example$''']
regexes = ['''replace-with-openssl-rand-base64-32''', '''replace-me''', '''change-me''']
